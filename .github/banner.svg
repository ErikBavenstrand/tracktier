<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="tracktour — rank every track on an album">
  <defs>
    <radialGradient id="glow" cx="50%" cy="0%" r="75%">
      <stop offset="0%" stop-color="#1fca97" stop-opacity="0.22"/>
      <stop offset="45%" stop-color="#1fca97" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#1fca97" stop-opacity="0"/>
    </radialGradient>
    <style>
      .bob { animation: bob 500ms ease-in-out infinite; transform-origin: 300px 286px; }
      .roll-rear { animation: roll 1000ms linear infinite; transform-origin: 181px 236px; }
      .roll-front { animation: roll 619ms linear infinite; transform-origin: 320px 254px; }
      @keyframes bob {
        0%   { transform: scaleY(1)    scaleX(1); }
        30%  { transform: scaleY(1.18) scaleX(0.94); }
        55%  { transform: scaleY(1)    scaleX(1); }
        80%  { transform: scaleY(0.87) scaleX(1.06); }
        100% { transform: scaleY(1)    scaleX(1); }
      }
      @keyframes roll { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        .bob, .roll-rear, .roll-front { animation: none; }
      }
    </style>
  </defs>

  <rect width="1280" height="400" fill="#08080a"/>
  <rect width="1280" height="400" fill="url(#glow)"/>

  <!-- Tractor, at 6x the in-app mark -->
  <g transform="translate(78, 94) scale(6)">
    <g class="bob">
      <rect x="25.6" y="4.6" width="2.6" height="11.4" rx="1.1" fill="#0c0c10"/>
      <path d="M10.5 16V5.6a1.6 1.6 0 0 1 1.6-1.6h8.6a1.6 1.6 0 0 1 1.5 1.1l2 9.4V16z" fill="#1fca97"/>
      <rect x="13" y="6.7" width="6.6" height="6.6" rx="1.2" fill="#0c0c10" opacity="0.55"/>
      <path d="M7.5 16h29.2a1.8 1.8 0 0 1 1.8 1.8v4.4a1.8 1.8 0 0 1-1.8 1.8H7.5z" fill="#1fca97"/>
      <rect x="30" y="18.4" width="7.4" height="2" rx="1" fill="#0c0c10"/>
    </g>
    <g>
      <circle cx="34.5" cy="24.5" r="5.2" fill="#18181e" stroke="#2b2b34" stroke-width="1.4"/>
      <circle cx="34.5" cy="24.5" r="1.9" fill="#1fca97"/>
      <g class="roll-front" fill="#1fca97">
        <rect x="33.9" y="19.9" width="1.2" height="9.2" rx="0.6"/>
        <rect x="33.9" y="19.9" width="1.2" height="9.2" rx="0.6" transform="rotate(60 34.5 24.5)"/>
        <rect x="33.9" y="19.9" width="1.2" height="9.2" rx="0.6" transform="rotate(120 34.5 24.5)"/>
      </g>
      <circle cx="13.5" cy="21.5" r="8.4" fill="#18181e" stroke="#2b2b34" stroke-width="1.4"/>
      <circle cx="13.5" cy="21.5" r="3" fill="#1fca97"/>
      <g class="roll-rear" fill="#1fca97">
        <rect x="12.8" y="13.6" width="1.4" height="15.8" rx="0.7"/>
        <rect x="12.8" y="13.6" width="1.4" height="15.8" rx="0.7" transform="rotate(45 13.5 21.5)"/>
        <rect x="12.8" y="13.6" width="1.4" height="15.8" rx="0.7" transform="rotate(90 13.5 21.5)"/>
        <rect x="12.8" y="13.6" width="1.4" height="15.8" rx="0.7" transform="rotate(135 13.5 21.5)"/>
      </g>
    </g>
  </g>

  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="452" y="212" font-size="104" font-weight="800" letter-spacing="-5" fill="#f3f3f4">tracktour.</text>
    <text x="458" y="262" font-size="27" font-weight="500" fill="#a7a7b0">Rank every track on an album, two at a time.</text>
    <text x="458" y="304" font-size="21" font-weight="500" fill="#6e6e78">32 questions. No account. The ranking lives in the link.</text>
  </g>

  <g transform="translate(458, 330)" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <g font-size="20" font-weight="900" fill="#08080a" text-anchor="middle">
      <rect x="0"   y="0" width="34" height="34" rx="8" fill="#1fca97"/><text x="17"  y="23">S</text>
      <rect x="42"  y="0" width="34" height="34" rx="8" fill="#36cf8a"/><text x="59"  y="23">A</text>
      <rect x="84"  y="0" width="34" height="34" rx="8" fill="#48b8c4"/><text x="101" y="23">B</text>
      <rect x="126" y="0" width="34" height="34" rx="8" fill="#6f9ad8"/><text x="143" y="23">C</text>
      <rect x="168" y="0" width="34" height="34" rx="8" fill="#9b87d6"/><text x="185" y="23">D</text>
    </g>
  </g>
</svg>
