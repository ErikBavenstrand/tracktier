<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="tracktour — rank every track on an album">
  <defs>
    <radialGradient id="glow" cx="50%" cy="12%" r="70%">
      <stop offset="0%" stop-color="#1fca97" stop-opacity="0.26"/>
      <stop offset="45%" stop-color="#1fca97" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#1fca97" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="640" fill="#08080a"/>
  <rect width="1280" height="640" fill="url(#glow)"/>

  <!-- The mark, held still: a still frame of a bob would only look like a
       mistake, so the card shows the tractor at rest. -->
  <g transform="translate(472, 128) scale(7)">
    <g>
      <rect x="25.6" y="4.6" width="2.6" height="11.4" rx="1.1" fill="#0c0c10"/>
      <path d="M10.5 16V5.6a1.6 1.6 0 0 1 1.6-1.6h8.6a1.6 1.6 0 0 1 1.5 1.1l2 9.4V16z" fill="#1fca97"/>
      <rect x="13" y="6.7" width="6.6" height="6.6" rx="1.2" fill="#0c0c10" opacity="0.55"/>
      <path d="M7.5 16h29.2a1.8 1.8 0 0 1 1.8 1.8v4.4a1.8 1.8 0 0 1-1.8 1.8H7.5z" fill="#1fca97"/>
      <rect x="30" y="18.4" width="7.4" height="2" rx="1" fill="#0c0c10"/>
    </g>
    <g>
      <circle cx="34.5" cy="24.5" r="5.2" fill="#18181e" stroke="#2b2b34" stroke-width="1.4"/>
      <circle cx="34.5" cy="24.5" r="1.9" fill="#1fca97"/>
      <g fill="#1fca97">
        <rect x="33.9" y="19.9" width="1.2" height="9.2" rx="0.6"/>
        <rect x="33.9" y="19.9" width="1.2" height="9.2" rx="0.6" transform="rotate(60 34.5 24.5)"/>
        <rect x="33.9" y="19.9" width="1.2" height="9.2" rx="0.6" transform="rotate(120 34.5 24.5)"/>
      </g>
      <circle cx="13.5" cy="21.5" r="8.4" fill="#18181e" stroke="#2b2b34" stroke-width="1.4"/>
      <circle cx="13.5" cy="21.5" r="3" fill="#1fca97"/>
      <g fill="#1fca97">
        <rect x="12.8" y="13.6" width="1.4" height="15.8" rx="0.7"/>
        <rect x="12.8" y="13.6" width="1.4" height="15.8" rx="0.7" transform="rotate(45 13.5 21.5)"/>
        <rect x="12.8" y="13.6" width="1.4" height="15.8" rx="0.7" transform="rotate(90 13.5 21.5)"/>
        <rect x="12.8" y="13.6" width="1.4" height="15.8" rx="0.7" transform="rotate(135 13.5 21.5)"/>
      </g>
    </g>
  </g>

  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="640" y="444" font-size="104" font-weight="800" letter-spacing="-5" fill="#f3f3f4">tracktour.</text>
    <text x="640" y="492" font-size="27" font-weight="500" fill="#a7a7b0">Rank every track on an album, two at a time.</text>
  </g>
</svg>
